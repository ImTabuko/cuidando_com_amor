# Configuração do Netlify para Cuidando com Amor
# 
# IMPORTANTE: O Netlify não tem Flutter instalado por padrão
# 
# OPÇÃO 1: Build Local + Netlify Drop (Recomendado - Mais Rápido)
# 1. Execute: cd cuidando_com_amor && flutter build web --release
# 2. Acesse: https://app.netlify.com/drop
# 3. Arraste a pasta cuidando_com_amor/build/web
#
# OPÇÃO 2: Build Automático (usa script que instala Flutter)
# Configure no painel do Netlify:
# - Base directory: (raiz do repositório - deixe vazio)
# - Build command: bash .netlify-build.sh
# - Publish directory: cuidando_com_amor/build/web
# - Environment variables: Nenhuma necessária

[build]
  command = "bash .netlify-build.sh"
  publish = "cuidando_com_amor/build/web"
  
  # Configurações de ambiente (se necessário)
  # [build.environment]
  #   FLUTTER_VERSION = "3.x.x"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de segurança
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache para assets estáticos
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

